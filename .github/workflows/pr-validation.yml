name: 🧪 PR Validation
run-name: "✅ Validate PR #${{ github.event.pull_request.number }}"

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: "✅ Validate PR"
    runs-on: ubuntu-latest
    env:
      npm_config_minimum_release_age: 0
      npm_config_strict_dep_builds: false
      npm_config_verify_deps_before_run: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.minimum-release-age=0 --config.strict-dep-builds=false

      - name: Generate Prisma Client
        run: pnpm --config.minimum-release-age=0 --config.verify-deps-before-run=false run prisma:generate

      - name: Run lint:check
        run: pnpm --config.minimum-release-age=0 --config.verify-deps-before-run=false run lint:check

      - name: Run tests
        run: pnpm --config.minimum-release-age=0 --config.verify-deps-before-run=false run test

      - name: Build project
        run: pnpm --config.minimum-release-age=0 --config.verify-deps-before-run=false run build
