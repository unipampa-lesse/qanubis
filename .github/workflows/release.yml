name: 📦 Release

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

on:
  push:
    branches:
      - main

jobs:
  release:
    name: 📦 Release
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.release.outputs.new_release_published }}
      new_release_version: ${{ steps.release.outputs.new_release_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Run Semantic Release
        id: release
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: 🚀 Deploy to Vercel
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    environment: prd
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Bootstrap admin user
        run: npx tsx prisma/seed.ts
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Deploy to Vercel
        run: |
          npx vercel --token ${{ secrets.VERCEL_TOKEN }} --prod --yes \
            --env DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            --env NEXTAUTH_SECRET="${{ secrets.NEXTAUTH_SECRET }}" \
            --env NEXTAUTH_URL="${{ secrets.NEXTAUTH_URL }}" \
            --env GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
            --env GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            --env STORAGE_PROVIDER="${{ secrets.STORAGE_PROVIDER }}" \
            --env STORAGE_ENDPOINT="${{ secrets.STORAGE_ENDPOINT }}" \
            --env STORAGE_REGION="${{ secrets.STORAGE_REGION }}" \
            --env STORAGE_ACCESS_KEY="${{ secrets.STORAGE_ACCESS_KEY }}" \
            --env STORAGE_SECRET_KEY="${{ secrets.STORAGE_SECRET_KEY }}" \
            --env STORAGE_BUCKET="${{ secrets.STORAGE_BUCKET }}" \
            --env EMAIL_PROVIDER="${{ secrets.EMAIL_PROVIDER }}" \
            --env SMTP_HOST="${{ secrets.SMTP_HOST }}" \
            --env SMTP_PORT="${{ secrets.SMTP_PORT }}" \
            --env SMTP_USER="${{ secrets.SMTP_USER }}" \
            --env SMTP_PASS="${{ secrets.SMTP_PASS }}" \
            --env SMTP_FROM="${{ secrets.SMTP_FROM }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
